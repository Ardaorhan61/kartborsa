name: Kart izleri (kart tarama için)

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/kart_izi.py'
      - '.github/workflows/kart-izi.yml'
  workflow_dispatch: {}
  schedule:
    - cron: "17 2 * * 1"   # her pazartesi 05:17 (Türkiye saati): yeni kartların izleri eklenir

permissions:
  contents: write
  actions: write

concurrency:
  group: kart-izi
  cancel-in-progress: false

jobs:
  iz:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
        with:
          path: site

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerekli paketler
        run: pip install numpy pillow

      - name: Eski izleri al
        run: |
          git clone --depth 1 --branch kart-izi "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" izi \
            || mkdir -p izi

      - name: Japonca katalog
        run: |
          git clone --depth 1 --branch fiyat-verisi "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" veri \
            || mkdir -p veri

      - name: Magic kataloğu
        run: |
          git clone --depth 1 --branch magic-verisi "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" mveri \
            || mkdir -p mveri

      - name: Yayındaki Pokémon kataloglarını al
        run: |
          mkdir -p yayin
          for dosya in cards.json cards_ja.json; do
            if curl -fsSL --retry 2 --max-time 45 "https://www.kartborsa.com/$dosya" -o "yayin/$dosya.tmp"; then
              mv "yayin/$dosya.tmp" "yayin/$dosya"
            fi
          done

      - name: Kart izlerini hesapla
        env:
          MG_SURE: "5400"
          KARTLAR_EN: yayin/cards.json
          KARTLAR_JA: yayin/cards_ja.json
          KART_FIYAT_SETLERI: veri/set
        run: python site/.github/scripts/kart_izi.py site izi veri/japonca/cards_ja.json veri/cyberpunk/cards_cp.json mveri/cards_mg.json

      - name: İzleri kaydet
        run: |
          cd izi
          rm -rf .git
          git init -q -b kart-izi
          git config user.name "KartBorsa kart izi"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Kart izleri $(TZ=Europe/Istanbul date '+%d.%m.%Y')"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" kart-izi

      - name: Siteyi yeniden yayınla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for bekleme in 5 15 30; do
            if gh workflow run yayin.yml --repo "${{ github.repository }}" --ref main -f yalniz_yayin=true; then
              exit 0
            fi
            sleep "$bekleme"
          done
          exit 1

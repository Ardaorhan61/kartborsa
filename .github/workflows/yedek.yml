name: Günlük ilan yedeği

on:
  schedule:
    - cron: "17 0 * * *"   # her gün 03:17 (Türkiye saati)
  workflow_dispatch: {}      # istendiğinde elle çalıştırmak için

permissions:
  contents: write

concurrency:
  group: yedek
  cancel-in-progress: false

jobs:
  yedekle:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://nhftbsguwnpknksqmqni.supabase.co
      SUPABASE_KEY: sb_publishable_ODVKFrVJrw94RBakGxiDgg_QcqMG_ZW
    steps:
      - uses: actions/checkout@v4
        with:
          path: kod
      - name: Yedek dalını hazırla
        run: |
          git clone --depth 1 --branch yedek "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" yedek \
            || (mkdir yedek && cd yedek && git init -q -b yedek && git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git")
      - name: İlanları ve fotoğrafları indir
        run: python3 kod/.github/scripts/yedekle.py yedek
      - name: Kaydet
        run: |
          cd yedek
          git config user.name "KartBorsa yedek"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Değişiklik yok"; exit 0; fi
          git commit -qm "Yedek $(TZ=Europe/Istanbul date '+%d.%m.%Y %H:%M')"
          git push -q origin yedek

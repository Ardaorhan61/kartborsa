name: Japonca promo fiyatları (Card Rush)

# Her gün fiyat güncellemesinden (06:41 TR) önce çalışır: TCGplayer / Cardmarket'te fiyatı olmayan
# Japonca promo kartları için Card Rush mağaza fiyatlarını okur → fiyat-verisi dalında japonca/cardrush.json.
# Yayında (yayin.yml "Card Rush fiyatları") sadece başka kaynakta fiyatı olmayan kartlara uygulanır.
on:
  schedule:
    - cron: "7 3 * * *"   # 06:07 (Türkiye saati)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: yayin            # fiyat-verisi dalına yazan işler sırayla çalışsın
  cancel-in-progress: false

jobs:
  cardrush:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: site
      - name: Fiyat verisini al
        run: git clone --depth 1 --branch fiyat-verisi "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" veri
      - name: Card Rush fiyatlarını oku
        id: cr
        timeout-minutes: 25
        run: python3 site/.github/scripts/ja_cardrush.py veri
      - name: Kaydet
        if: steps.cr.outcome == 'success'
        run: |
          cd veri
          if git status --porcelain | grep -q .; then
            git config user.name "KartBorsa fiyat"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -qm "Card Rush Japonca promo fiyatları $(TZ=Europe/Istanbul date '+%d.%m.%Y')"
            git push -q origin HEAD:fiyat-verisi
          fi

name: Fiyatları güncelle ve siteyi yayınla

on:
  schedule:
    - cron: "41 3 * * *"   # her gün 06:41 (Türkiye saati), fiyatlar güncellendikten sonra
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: yayin
  cancel-in-progress: false

jobs:
  yayin:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy1.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: site

      - name: Fiyat verisini al
        run: |
          git clone --depth 1 --branch fiyat-verisi "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" veri \
            || mkdir -p veri

      - name: Kart izlerini al (kart tarama)
        run: |
          git clone --depth 1 --branch kart-izi "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" izi \
            || mkdir -p izi

      - name: İngilizce katalog eksiklerini tamamla (TCGdex + Scrydex resimleri)
        continue-on-error: true
        timeout-minutes: 20
        run: python3 site/.github/scripts/en_ek.py site/cards.json

      - name: Fiyatları güncelle
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || hashFiles('veri/ozet.json') == ''
        continue-on-error: true
        id: fiyat
        env:
          FIYAT_SURE_DK: "80"   # tüm setler her sabah yenilensin diye (45 dk'ya sığmıyordu)
        run: python3 site/.github/scripts/fiyatlar.py veri site/cards.json

      - name: Japonca katalog ve fiyatlar
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || hashFiles('veri/japonca/cards_ja.json') == ''
        continue-on-error: true
        id: japonca
        run: python3 site/.github/scripts/japonca.py veri

      - name: Japonca eksikleri tamamla (Pokellector)
        if: steps.japonca.outcome == 'success' || github.event_name == 'workflow_dispatch' || hashFiles('veri/japonca/ek.json') == ''
        continue-on-error: true
        id: ek
        timeout-minutes: 30
        run: python3 site/.github/scripts/ja_ek.py veri site

      - name: Japonca kartların İngilizce adları (Limitless + Bulbapedia, haftada bir)
        continue-on-error: true
        id: jaen
        timeout-minutes: 25
        run: python3 site/.github/scripts/ja_en.py veri

      - name: Fiyat verisini kaydet
        if: steps.fiyat.outcome == 'success' || steps.japonca.outcome == 'success' || steps.ek.outcome == 'success' || steps.jaen.outcome == 'success'
        run: |
          cd veri
          rm -rf .git
          git init -q -b fiyat-verisi
          git config user.name "KartBorsa fiyat"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Fiyatlar $(TZ=Europe/Istanbul date '+%d.%m.%Y')"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" fiyat-verisi

      - name: Siteyi hazırla
        run: |
          mkdir -p _site/fiyat
          cp site/index.html site/cards.json _site/
          cp site/*.html _site/ 2>/dev/null || true
          cp site/sw.js _site/ 2>/dev/null || true
          sed -i "s/__SURUM__/$(date +%s)/g" _site/index.html
          cp -r site/img _site/ 2>/dev/null || true
          touch _site/.nojekyll
          cp veri/japonca/cards_ja.json _site/ 2>/dev/null || true
          mkdir -p _site/tara && cp izi/izler*.json _site/tara/ 2>/dev/null || true
          cp -r veri/set veri/ozet.json veri/kur.json _site/fiyat/ 2>/dev/null || true
          ls -la _site _site/fiyat | head -20

      - name: Kart dosyasını küçült (ayrıntılar ayrı dosyaya)
        run: |
          python3 - <<'PY'
          import json, os
          os.makedirs('_site/detay', exist_ok=True)
          # ADV / DP Japonca setleri (Bulbapedia listesi + İngilizce karşılık kartın bilgileri ve resmi)
          bp_yol = 'site/.github/scripts/ja_bulbapedia.json'
          if os.path.exists(bp_yol) and os.path.exists('_site/cards_ja.json'):
              bp = json.load(open(bp_yol, encoding='utf-8'))
              en = json.load(open('_site/cards.json', encoding='utf-8'))
              enk = {c[14]: c for c in en['cards']}
              ja = json.load(open('_site/cards_ja.json', encoding='utf-8'))
              var = {s[0] for s in ja['sets']}
              gr = [(s, []) for s in ja['sets']]
              for c in ja['cards']:
                  gr[c[1]][1].append(c)
              eklenen = 0
              for sid, b in bp.items():
                  if sid in var:
                      continue
                  seri = b.get('seri') or ('ADV' if sid.startswith('ja-ADV') else 'DP')
                  s = [sid, b['ja'] or b['ad'], seri, b['tarih'], len(b['kart']), '', b['sembol'], 'ja', 'bp']
                  ks = []
                  for no, nd, ecid in b['kart']:
                      e = enk.get(ecid)
                      if not e:
                          continue
                      esid = ecid.rsplit('-', 1)[0]
                      img = e[13] or f'https://images.pokemontcg.io/{esid}/{e[2]}.png'
                      ks.append([e[0], 0, no, nd, e[4], e[5], e[6], e[7], e[8], e[9], e[10], e[11], e[12], img,
                                 f'{sid}-{no}', e[0], 'bp'])
                  gr.append((s, ks))
                  eklenen += 1
              gr.sort(key=lambda g: (g[0][3] or '9999', g[0][0]))
              ja['sets'], ja['cards'] = [], []
              for i, (s, ks) in enumerate(gr):
                  ja['sets'].append(s)
                  for c in ks:
                      c[1] = i
                      ja['cards'].append(c)
              json.dump(ja, open('_site/cards_ja.json', 'w', encoding='utf-8'), separators=(',', ':'), ensure_ascii=False)
              print('Bulbapedia setleri eklendi:', eklenen)
          # Japonca promo setleri (Bulbapedia): olmayan setler eklenir, olan setlerde eksik numaralar tamamlanır
          pr_yol = 'site/.github/scripts/ja_promo.json'
          if os.path.exists(pr_yol) and os.path.exists('_site/cards_ja.json'):
              pr = json.load(open(pr_yol, encoding='utf-8'))
              ja = json.load(open('_site/cards_ja.json', encoding='utf-8'))
              sidx = {s[0]: i for i, s in enumerate(ja['sets'])}
              gr = [(s, []) for s in ja['sets']]
              for c in ja['cards']:
                  gr[c[1]][1].append(c)
              ad_resim = {}
              for c in ja['cards']:
                  for a in (c[0], c[15] if len(c) > 15 else ''):
                      if a and c[13] and a not in ad_resim:
                          ad_resim[a] = c[13]
              TIP = {'Grass', 'Fire', 'Water', 'Lightning', 'Psychic', 'Fighting', 'Darkness', 'Metal', 'Fairy',
                     'Dragon', 'Colorless'}
              SERI_P = {'ja-ADVP': 'ADV', 'ja-PCGP': 'PCG', 'ja-LP': 'LEGEND', 'ja-DPP': 'DP', 'ja-PPP': 'DP',
                        'ja-DPTP': 'DPt', 'ja-PP': 'ポケットモンスターカードゲーム', 'ja-TP': 'ポケットモンスターカードゲーム'}
              ek_kart = 0
              for sid, b in pr.items():
                  if sid in sidx:
                      s, ks = gr[sidx[sid]]
                  else:
                      s, ks = [sid, b['ad'], SERI_P.get(sid, 'プロモ'), b['tarih'], len(b['kart']), '', '', 'ja', 'bp'], []
                      gr.append((s, ks))
                  var = {str(c[2]).lstrip('0') or '0' for c in ks}
                  for no, ad, tip, img in b['kart']:
                      if no in var:
                          continue
                      var.add(no)
                      kat = 'Energy' if ('Energy' in ad or tip == 'Energy') else ('Pokémon' if tip in TIP else 'Trainer')
                      ks.append([ad, 0, no, 'Promo', kat, tip if kat == 'Trainer' else '', '', tip if tip in TIP else '',
                                 '', [], [], [], '', img or (ad_resim.get(ad, '') if kat != 'Pokémon' else ''), f'{sid}-b{no}', ad, 'bp'])
                      ek_kart += 1
              gr.sort(key=lambda g: (g[0][3] or '9999', g[0][0]))
              ja['sets'], ja['cards'] = [], []
              for i, (s, ks) in enumerate(gr):
                  ja['sets'].append(s)
                  for c in sorted(ks, key=lambda c: (int(c[2]) if str(c[2]).isdigit() else 99999, str(c[2]))):
                      c[1] = i
                      ja['cards'].append(c)
              json.dump(ja, open('_site/cards_ja.json', 'w', encoding='utf-8'), separators=(',', ':'), ensure_ascii=False)
              print('Promo kartları eklendi:', ek_kart)
          # Elle bulunan düzeltmeler (Bulbapedia): logolar, resimler, eksik kartlar, çıkmamış kartların silinmesi
          dz_yol = 'site/.github/scripts/ja_duzeltme.json'
          if os.path.exists(dz_yol) and os.path.exists('_site/cards_ja.json'):
              dz = json.load(open(dz_yol, encoding='utf-8'))
              # enerji tipleri (Bulbapedia set listelerinden numara+ad eşleşmesiyle doğrulandı)
              TIPH = {'G': 'Grass', 'R': 'Fire', 'W': 'Water', 'L': 'Lightning', 'P': 'Psychic', 'F': 'Fighting', 'D': 'Darkness',
                      'M': 'Metal', 'Y': 'Fairy', 'N': 'Dragon', 'C': 'Colorless'}
              tip_yol = 'site/.github/scripts/ja_tip.json'
              JTIP = {k: TIPH[v] for k, v in json.load(open(tip_yol, encoding='utf-8')).items() if v in TIPH} if os.path.exists(tip_yol) else {}
              ja = json.load(open('_site/cards_ja.json', encoding='utf-8'))
              sidx = {s[0]: i for i, s in enumerate(ja['sets'])}
              for s in ja['sets']:
                  if not s[5] and dz.get('logo', {}).get(s[0]):
                      s[5] = dz['logo'][s[0]]
                  if not s[6] and dz.get('sembol', {}).get(s[0]):
                      s[6] = dz['sembol'][s[0]]
                  if dz.get('setad', {}).get(s[0]):
                      s[1] = dz['setad'][s[0]]
                  if dz.get('setsayi', {}).get(s[0]):
                      s[4] = dz['setsayi'][s[0]]
              sil = set(dz.get('sil', []))
              gr = [[] for _ in ja['sets']]
              for c in ja['cards']:
                  k = ja['sets'][c[1]][0] + '|' + (str(c[2]).lstrip('0') or '0')
                  if k in sil or not c[0]:
                      continue
                  if not c[13] and dz.get('resim', {}).get(k):
                      c[13] = dz['resim'][k]
                  if len(c) > 16 and dz.get('ad', {}).get(k):
                      c[15] = c[15] or c[0]
                      c[0] = dz['ad'][k]
                  if dz.get('adid', {}).get(c[14]):
                      c[15] = c[15] or c[0]
                      c[0] = dz['adid'][c[14]]
                  if not c[7] and JTIP.get(c[14]):
                      c[7] = JTIP[c[14]]
                  if not c[3] and dz.get('nadir', {}).get(c[14]):
                      c[3] = dz['nadir'][c[14]]
                  gr[c[1]].append(c)
              TIP = {'Grass', 'Fire', 'Water', 'Lightning', 'Psychic', 'Fighting', 'Darkness', 'Metal', 'Fairy',
                     'Dragon', 'Colorless'}
              eklenen = 0
              for sid, liste in dz.get('ekle', {}).items():
                  if sid not in sidx:
                      continue
                  ks = gr[sidx[sid]]
                  var = {str(c[2]).lstrip('0') or '0' for c in ks}
                  for no, ad, tip, img in liste:
                      if no in var:
                          continue
                      var.add(no)
                      kat = 'Energy' if ('Energy' in ad or tip == 'Energy') else ('Pokémon' if tip in TIP else 'Trainer')
                      ks.append([dz.get('ad', {}).get(f'{sid}|{no}', ad), sidx[sid], no, '', kat, '', '', tip if tip in TIP else '', '', [], [], [], '', img,
                                 f'{sid}-d{no}', ad, 'bp'])
                      eklenen += 1
                  ks.sort(key=lambda c: (int(c[2]) if str(c[2]).isdigit() else 99999, str(c[2])))
              ja['cards'] = [c for ks in gr for c in ks]
              # etiketler (ör. McDonald's promoları) aramada ve kart detayında görünür
              etiket = dz.get('etiket', {})
              for c in ja['cards']:
                  if etiket.get(c[14]):
                      c[12] = etiket[c[14]]
              # elle eklenen yeni setler (Bulbapedia): tarihine göre doğru yere yerleştirilir
              for ysid, ys in dz.get('yeniset', {}).items():
                  if any(s[0] == ysid for s in ja['sets']):
                      continue
                  yer = next((i for i, s in enumerate(ja['sets']) if (s[3] or '9999') > ys['tarih']), len(ja['sets']))
                  for c in ja['cards']:
                      if c[1] >= yer:
                          c[1] += 1
                  ja['sets'].insert(yer, [ysid, ys['ad'], ys['seri'], ys['tarih'], len(ys['kartlar']), ys.get('logo', ''),
                                          ys.get('sembol', ''), 'ja', 'bp'])
                  yk = [[k[1] or k[2], yer, k[0], 'Promo', 'Pokémon', 'Basic', k[5] or '', k[3] or '', '', [], [], [],
                         ys.get('etiket', ''), k[4], f'{ysid}-{k[0]}', k[2], 'bp'] for k in ys['kartlar']]
                  bas = next((i for i, c in enumerate(ja['cards']) if c[1] > yer), len(ja['cards']))
                  ja['cards'][bas:bas] = yk
                  print('Yeni set eklendi:', ysid, len(yk), 'kart')
              json.dump(ja, open('_site/cards_ja.json', 'w', encoding='utf-8'), separators=(',', ':'), ensure_ascii=False)
              print('Düzeltmeler uygulandı, eklenen kart:', eklenen)
          # İngilizce katalog: elle doğrulanmış eksik kartlar (TCGdex verisi + Bulbapedia resmi)
          en_yol = 'site/.github/scripts/en_duzeltme.json'
          if os.path.exists(en_yol) and os.path.exists('_site/cards.json'):
              ez = json.load(open(en_yol, encoding='utf-8'))
              en = json.load(open('_site/cards.json', encoding='utf-8'))
              eidx = {s[0]: i for i, s in enumerate(en['sets'])}
              var = {c[14] for c in en['cards']}
              eklendi = 0
              for sid, liste in ez.get('ekle', {}).items():
                  if sid not in eidx:
                      continue
                  for k in liste:
                      if k['id'] in var:
                          continue
                      kart = [k['ad'], eidx[sid], k['no'], k.get('nadir', ''), k.get('tur', 'Pokémon'), k.get('alt', ''), k.get('hp', ''),
                              k.get('tip', ''), k.get('cizer', ''), [], [], [], k.get('onceki', ''), k['resim'], k['id']]
                      son = max((i for i, c in enumerate(en['cards']) if c[1] == eidx[sid]), default=len(en['cards']) - 1)
                      en['cards'].insert(son + 1, kart)
                      var.add(k['id'])
                      eklendi += 1
              json.dump(en, open('_site/cards.json', 'w', encoding='utf-8'), separators=(',', ':'), ensure_ascii=False)
              print('İngilizce eklenen kart:', eklendi)
          for p in ('_site/cards.json', '_site/cards_ja.json'):
              if not os.path.exists(p):
                  continue
              d = json.load(open(p, encoding='utf-8'))
              det = {}
              for c in d['cards']:
                  cid = c[14]
                  sid = cid.rsplit('-', 1)[0]
                  det.setdefault(sid, {})[cid] = [c[9], c[10], c[11]]
                  c[9] = c[10] = c[11] = 0
              for sid, v in det.items():
                  json.dump(v, open(f'_site/detay/{sid}.json', 'w', encoding='utf-8'), separators=(',', ':'), ensure_ascii=False)
              d['lite'] = 1
              # hız: tekrar eden resim adresi başları kısaltılır (~0… ~6…), site yüklerken geri açar
              PFX = ['https://images.scrydex.com/pokemon/', 'https://assets.tcgdex.net/', 'https://den-cards.pokellector.com/',
                     'https://archives.bulbagarden.net/media/upload/', 'https://images.pokemontcg.io/',
                     'https://den-media.pokellector.com/logos/', 'img/ja/']

              def kisalt(u):
                  if isinstance(u, str):
                      for k, on in enumerate(PFX):
                          if u.startswith(on):
                              return '~' + str(k) + u[len(on):]
                  return u
              for c in d['cards']:
                  c[13] = kisalt(c[13])
              for s_ in d['sets']:
                  if len(s_) > 6:
                      s_[5] = kisalt(s_[5])
                      s_[6] = kisalt(s_[6])
              d['pfx'] = PFX
              json.dump(d, open(p, 'w', encoding='utf-8'), separators=(',', ':'), ensure_ascii=False)
              print(p, os.path.getsize(p) // 1024, 'KB,', len(det), 'ayrıntı dosyası')
          # Japonca setler: TCGdex'te logo/sembol yoksa img/ja/ içindeki görseller (ja-logo.yml indirir)
          p = '_site/cards_ja.json'
          if os.path.exists(p):
              d = json.load(open(p, encoding='utf-8'))
              n = 0
              for s in d['sets']:
                  if not s[5] and os.path.exists(f'_site/img/ja/{s[0]}.png'):
                      s[5] = f'img/ja/{s[0]}.png'; n += 1
                  if not s[6] and os.path.exists(f'_site/img/ja/{s[0]}.sym.png'):
                      s[6] = f'img/ja/{s[0]}.sym.png'
              json.dump(d, open(p, 'w', encoding='utf-8'), separators=(',', ':'), ensure_ascii=False)
              print('Japonca logo eklenen set:', n)
          PY

      - name: Japonca adların yanına İngilizce adlar
        continue-on-error: true
        run: python3 site/.github/scripts/ja_en_uygula.py veri site _site/cards_ja.json

      - name: Japonca fiyatı olmayan kartlar (TCGplayer / tcgcsv.com)
        if: github.event_name != 'push' || hashFiles('veri/japonca/tcgplayer.json') == ''
        continue-on-error: true
        id: jatp
        timeout-minutes: 15
        run: python3 site/.github/scripts/ja_tcgplayer.py veri _site

      - name: TCGplayer Japonca fiyatlarını kaydet
        if: steps.jatp.outcome == 'success'
        run: |
          cd veri
          rm -rf .git
          git init -q -b fiyat-verisi
          git config user.name "KartBorsa fiyat"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Fiyatlar + TCGplayer Japonca $(TZ=Europe/Istanbul date '+%d.%m.%Y')"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" fiyat-verisi

      - name: Cyberpunk TCG kataloğu ve fiyatları (TCGplayer / tcgcsv.com)
        continue-on-error: true
        id: cp
        timeout-minutes: 10
        run: python3 site/.github/scripts/cyberpunk.py veri _site
      - name: Cyberpunk fiyatlarını kaydet
        if: steps.cp.outcome == 'success'
        run: |
          cd veri
          rm -rf .git
          git init -q -b fiyat-verisi
          git config user.name "KartBorsa fiyat"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Fiyatlar + Cyberpunk $(TZ=Europe/Istanbul date '+%d.%m.%Y')"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" fiyat-verisi
      - name: Elle eklenen fiyatlar (ek_fiyat.json; kaynağı ve tarihi kayıtlı)
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json, os, datetime
          yol = 'site/.github/scripts/ek_fiyat.json'
          oz_yol = '_site/fiyat/ozet.json'
          if not (os.path.exists(yol) and os.path.exists(oz_yol)):
              raise SystemExit(0)
          ek = json.load(open(yol, encoding='utf-8')).get('kartlar', {})
          oz = json.load(open(oz_yol))
          bugun = (datetime.datetime.utcnow() + datetime.timedelta(hours=3)).date()
          n = 0
          for cid, k in ek.items():
              try:
                  gun = datetime.date.fromisoformat(k['tarih'])
              except Exception:
                  continue
              if (bugun - gun).days > 14:
                  print('Eski kayıt (14 günden eski), uygulanmadı:', cid)
                  continue
              v = oz['c'].get(cid)
              if v and any(isinstance(x, (int, float)) and x > 0 for x in v[:4]):
                  continue  # otomatik kaynak fiyat veriyor, o kullanılır
              usd, eur = k.get('usd'), k.get('eur')
              if usd is None and eur is None:
                  continue
              sid = cid.rsplit('-', 1)[0]
              sp = f'_site/fiyat/set/{sid}.json'
              sd = json.load(open(sp)) if os.path.exists(sp) else {'u': k['tarih'], 'c': {}}
              rec = sd['c'].get(cid, {})
              h = sorted([x for x in rec.get('h', []) if x[0] != k['tarih']] + [[k['tarih'], usd, eur]], key=lambda x: x[0])
              rec['h'] = h
              tarih = k['tarih'].replace('-', '/')
              if usd is not None:
                  var = k.get('varyant') or 'normal'
                  rec['t'] = {var: [None, None, None, usd]}
                  rec['v'] = var
                  rec['tu'] = tarih
              if eur is not None:
                  rec['m'] = [None, None, eur, None, None, None, None]
                  rec['mu'] = tarih
              rec['ek'] = {'k': k.get('kaynak', ''), 'u': k.get('url', ''), 'd': k['tarih']}
              sd['c'][cid] = rec
              os.makedirs(os.path.dirname(sp), exist_ok=True)
              json.dump(sd, open(sp, 'w'), separators=(',', ':'))
              once = h[-2] if len(h) >= 2 else [None, None, None]
              oz['c'][cid] = [usd, eur, None, None, once[1], once[2], once[0]]
              n += 1
              print('Elle eklenen fiyat:', cid, usd, eur, k.get('url', ''))
          json.dump(oz, open(oz_yol, 'w'), separators=(',', ':'))
          print('Elle eklenen fiyat uygulandı:', n)
          PY
      - name: Card Rush fiyatları (Japonca promolar; sadece başka kaynakta fiyatı olmayan kartlara)
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json, os, datetime
          yol = 'veri/japonca/cardrush.json'
          oz_yol = '_site/fiyat/ozet.json'
          if not (os.path.exists(yol) and os.path.exists(oz_yol)):
              raise SystemExit(0)
          cr = json.load(open(yol, encoding='utf-8'))
          oz = json.load(open(oz_yol))
          bugun = (datetime.datetime.utcnow() + datetime.timedelta(hours=3)).date()
          kaynak_yol = '_site/fiyat/kaynak.json'
          kaynak = json.load(open(kaynak_yol)) if os.path.exists(kaynak_yol) else {}
          n = 0
          for cid, k in cr.get('c', {}).items():
              try:
                  gun = datetime.date.fromisoformat(k['tarih'])
              except Exception:
                  continue
              if (bugun - gun).days > 14 or not k.get('usd'):
                  continue
              v = oz['c'].get(cid)
              if v and any(isinstance(x, (int, float)) and x > 0 for x in v[:4]):
                  continue  # TCGplayer / Cardmarket fiyatı var, o kullanılır
              sid = cid.rsplit('-', 1)[0]
              sp = f'_site/fiyat/set/{sid}.json'
              sd = json.load(open(sp)) if os.path.exists(sp) else {'u': k['tarih'], 'c': {}}
              h = [[x[0], x[1], None] for x in k.get('h', [])]
              sd['c'][cid] = {'h': h, 'cr': {'y': k['y'], 's': k.get('s', 0), 'u': k.get('url', ''), 'd': k['tarih'],
                                             'ad': k.get('ad', ''), 'kur': cr.get('kur')}}
              os.makedirs(os.path.dirname(sp), exist_ok=True)
              json.dump(sd, open(sp, 'w'), ensure_ascii=False, separators=(',', ':'))
              once = h[-2] if len(h) >= 2 else [None, None, None]
              oz['c'][cid] = [k['usd'], None, None, None, once[1], once[2], once[0]]
              kaynak[cid] = 'Card Rush (Japon mağazası)'
              n += 1
          json.dump(oz, open(oz_yol, 'w'), separators=(',', ':'))
          json.dump(kaynak, open(kaynak_yol, 'w'), ensure_ascii=False, separators=(',', ':'))
          print('Card Rush fiyatı uygulanan kart:', n)
          PY
      - name: Google ve paylaşım sayfaları (kart/set sayfaları, site haritası, ikonlar)
        continue-on-error: true
        timeout-minutes: 15
        run: |
          pip install --quiet pillow || true
          python3 site/.github/scripts/seo.py _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Yayını tekrar dene (deploy-pages geçici hatası, ör. "No artifacts named github-pages")
        if: steps.deploy1.outcome == 'failure'
        run: sleep 60
      - id: deploy
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v4

name: Fiyatları güncelle ve siteyi yayınla

on:
  schedule:
    - cron: "41 3 * * *"   # her gün 06:41 (Türkiye saati), fiyatlar güncellendikten sonra
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: yayin
  cancel-in-progress: false

jobs:
  yayin:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: site

      - name: Fiyat verisini al
        run: |
          git clone --depth 1 --branch fiyat-verisi "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" veri \
            || mkdir -p veri

      - name: Fiyatları güncelle
        if: github.event_name != 'push' || hashFiles('veri/ozet.json') == ''
        continue-on-error: true
        id: fiyat
        run: python3 site/.github/scripts/fiyatlar.py veri site/cards.json

      - name: Fiyat verisini kaydet
        if: steps.fiyat.outcome == 'success'
        run: |
          cd veri
          rm -rf .git
          git init -q -b fiyat-verisi
          git config user.name "KartBorsa fiyat"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Fiyatlar $(TZ=Europe/Istanbul date '+%d.%m.%Y')"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" fiyat-verisi

      - name: Siteyi hazırla
        run: |
          mkdir -p _site/fiyat
          cp site/index.html site/cards.json _site/
          cp site/*.html _site/ 2>/dev/null || true
          cp -r site/img _site/ 2>/dev/null || true
          touch _site/.nojekyll
          cp -r veri/set veri/ozet.json veri/kur.json _site/fiyat/ 2>/dev/null || true
          ls -la _site _site/fiyat | head -20

      - name: Kart dosyasını küçült (ayrıntılar ayrı dosyaya)
        run: |
          python3 - <<'PY'
          import json, os
          p = '_site/cards.json'
          d = json.load(open(p, encoding='utf-8'))
          os.makedirs('_site/detay', exist_ok=True)
          det = {}
          for c in d['cards']:
              cid = c[-1]
              sid = cid.rsplit('-', 1)[0]
              det.setdefault(sid, {})[cid] = [c[9], c[10], c[11]]
              c[9] = c[10] = c[11] = 0
          for sid, v in det.items():
              json.dump(v, open(f'_site/detay/{sid}.json', 'w', encoding='utf-8'), separators=(',', ':'), ensure_ascii=False)
          d['lite'] = 1
          json.dump(d, open(p, 'w', encoding='utf-8'), separators=(',', ':'), ensure_ascii=False)
          print('cards.json', os.path.getsize(p) // 1024, 'KB,', len(det), 'ayrıntı dosyası')
          PY

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
